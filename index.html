<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>84T's Calculator</title>
    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400..900&display=swap" rel="stylesheet">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

</head>
<body>
    <div class="prod">
        <div class="calc">
            <div class="display">
                <h1 id="screen">
                    PRESS ME!
                </h1>
            </div>

            <div class="buttons">
                <div class="numButtons">
                    <div class="row1">
                        <button class="num" data-value="1" data-type="number">
                            1
                        </button>
                        <button class="num" data-value="2" data-type="number">
                            2
                        </button>
                        <button class="num" data-value="3" data-type="number">
                            3
                        </button>
                </div>
                <div class="row2">
                        <button class="num" data-value="4" data-type="number">
                            4
                        </button>
                        <button class="num" data-value="5" data-type="number">
                            5
                        </button>
                        <button class="num" data-value="6" data-type="number">
                            6
                        </button>
                    </div>
                    <div class="row3">
                        <button class="num" data-value="7" data-type="number">
                            7
                        </button>
                        <button class="num" data-value="8" data-type="number">
                            8
                        </button>
                        <button class="num" data-value="9" data-type="number">
                            9
                        </button>
                </div>
                 <div class="row4">
                    <button class="num" data-value="0" data-type="number">
                            0
                        </button> 
                     
                    <button class="num" data-value="backspace" data-type="backspace">
                            DEL
                        </button>


                </div>

            <div class="row5">
                <button class="addB" data-type="operator" data-value="+">+</button>
                <button class="subB" data-type="operator" data-value="-">-</button>
            </div>
             <div class="row6">
                <button class="divB" data-type="operator" data-value="/">/</button>
                <button class="multiplyB"data-type="operator" data-value="*">x</button>

               

                
            </div>
              <div class="row7 row4">
                    <button class="DEL" data-value="Delete" data-type="delete">
                            Clear
                        </button>


              <button class="num EQN" data-value="=" data-type="equal">
                            =
                </button>
                        
                     
                </div>

            </div>
               
                <div class="oButtons">

                </div>
            </div>
        </div>
    </div>
    <script src="index.js"></script>
</body>

</html>
